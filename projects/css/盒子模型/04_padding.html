<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>盒子的内边距 padding</title>
    <style>
        #d1 {
            width: 400px;
            height: 400px;
            background-color: lightblue;
            font-size: 20px;
            /*单侧内边距*/
            /*padding-left: 10px;*/
            /*padding-right: 20px;*/
            /*padding-top: 30px;*/
            /*padding-bottom: 40px;*/
            /*
            复合属性
                写一个值含义：四个方向的内边距一样
                写两个值含义：上下、左右
                写三个值含义：上、左右、下
                写四个值含义：上、右、下、左
            */
            padding: 20px;
            /*padding: 30px 20px 40px 10px;*/

        }

        /*对于行内元素，其左右内边距设置没有问题，上下内边距不能完美设置（会凸出遮挡上下行）*/
        /*块级元素、行内块元素，四个方向的内边距都可以完美设置*/
        span {
            background-color: orange;
            padding: 20px;
        }
    </style>
</head>
<body>
<div id="d1">一段文本</div>
<hr>
<span>行内元素文本</span>
<div>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Dolorum, illo nostrum! Sed.</div>
</body>
</html>
