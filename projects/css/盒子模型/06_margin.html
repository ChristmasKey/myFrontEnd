<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>盒子的外边距 margin</title>
    <style>
        #d1 {
            width: 400px;
            height: 400px;
            background-color: skyblue;

            /* 设置外边距 */
            /*margin: 20px;*/
            /*margin: 10px 20px;*/
            /*margin: 10px 20px 30px;*/
            margin: 10px 20px 30px 40px;

            /*margin-left: 10px;*/
            /*margin-top: 20px;*/
            /*margin-right: 30px;*/
            /*margin-bottom: 40px;*/
        }

        .outer {
            width: 400px;
            height: 400px;
            background-color: gray;
            padding: 50px;
        }

        .inner {
            width: 200px;
            height: 200px;
            background-color: orange;
            /*注意事项一：子元素的margin是参考父元素的content区域来计算的。*/
            margin: 25px;
        }

        .box {
            width: 200px;
            height: 200px;
        }

        .box1 {
            background-color: skyblue;
        }

        .box2 {
            background-color: orange;
            /*注意事项二：margin-top和margin-left会影响到元素的位置，而margin-right和margin-bottom会影响到右边元素和下方元素的位置。*/
            margin-top: 50px;
            margin-bottom: 50px;
        }

        .box3 {
            background-color: green;
        }

        .second {
            margin-left: 50px;
            margin-right: 50px;
        }

        #d2 {
            width: 400px;
            height: 400px;
            background-color: deepskyblue;
            margin: 50px;
        }

        #img1 {
            margin: 50px;
        }

        .one {
            background-color: orange;
        }

        .two {
            background-color: pink;
            /*注意事项三：对于行内元素来说，左右的margin是可以完美设置的，上下的margin设置后是无效的。*/
            margin-left: 50px;
            margin-right: 50px;
            margin-top: 3000px;
            margin-bottom: 3000px;
        }

        .three {
            background-color: blue;
        }

        #d3 {
            width: 800px;
            height: 100px;
            /*注意事项四：margin的值可以设为auto，给一个块级元素左右margin设置auto，则该元素会在其父元素内水平居中。*/
            margin-left: auto;
            margin-right: auto;
            /*margin: 100px auto;*/
            background-color: deepskyblue;
        }

        #sp1 {
            background-color: purple;
            margin: 0 auto;
        }

        .bx {
            width: 200px;
            height: 200px;
        }

        .bx1 {
            background-color: deepskyblue;
        }

        .bx2 {
            background-color: orange;
            /*注意事项五：margin的值可以设置为负值。*/
            margin-top: -50px;
        }
    </style>
</head>
<body>
<div id="d1">Lorem ipsum dolor sit amet, consectetur adipisicing elit. Quos, saepe.</div>
<!--注意事项一-->
<div class="outer">
    <div class="inner"></div>
</div>
<!--注意事项二-->
<div class="box box1">1</div>
<div class="box box2">2</div>
<div class="box box3">3</div>
<hr>
<img src="../image.png" alt="image"><img class="second" src="../image.png" alt="image"><img src="../image.png"
                                                                                            alt="image">
<!--注意事项三-->
<div id="d2">一段文本内容</div>
<div>另一段文本内容</div>
<hr>
<img id="img1" src="../image.png" alt="images">
<div>另一段文本内容</div>
<hr>
<span class="one">人之初</span><span class="two">性本善</span><span class="three">性相近</span>
<!--注意事项四-->
<div id="d3">Hello</div>
<hr>
<span id="sp1">Hello World</span>
<!--注意事项五-->
<div class="bx bx1">1</div>
<div class="bx bx2">2</div>
</body>
</html>
