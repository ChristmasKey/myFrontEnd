<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>盒子模型的组成部分</title>
    <style>
        div:nth-child(1) {
            width: 400px;
            height: 400px;
            background-color: gray;
            font-size: 20px;

            /* 内边距，设置的背景色会填充内边距区域 */
            padding: 20px;
            /* 边框，设置的背景色会填充边框区域 */
            border: 10px solid black;
            /* 外边距，设置的背景色不会填充外边距区域 */
            margin: 20px;
        }
    </style>
</head>
<body>
<div>Hello World</div>
</body>
</html>
