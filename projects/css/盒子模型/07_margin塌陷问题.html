<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>margin塌陷问题</title>
    <style>
        .outer {
            width: 400px;
            /*height: 400px;*/
            background-color: gray;
            /*解决方案一*/
            /*border: 1px solid red;*/
            /*解决方案二*/
            /*padding: 1px;*/
            /*解决方案三*/
            overflow: hidden;
        }

        .inner1 {
            width: 100px;
            height: 100px;
            background-color: orange;
            margin-top: 50px;
        }

        .inner2 {
            width: 100px;
            height: 100px;
            background-color: green;
            margin-bottom: 50px;
        }
    </style>
</head>
<body>
<div>第一行文本</div>
<div class="outer">
    <div class="inner1">inner1</div>
    <div class="inner2">inner2</div>
</div>
<div>另一行文本</div>
</body>
</html>
