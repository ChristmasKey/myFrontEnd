<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>盒子的内容区 Content</title>
    <style>
        div:nth-child(1) {
            background-color: skyblue;
            height: 200px;
            width: 200px;
            /*设置内容区域的最小宽度*/
            min-width: 600px;
            /*设置内容区域的最大宽度*/
            max-width: 1000px;
            /*设置内容区域的最小高度*/
            min-height: 50px;
            /*设置内容区域的最大高度*/
            max-height: 400px;
        }
    </style>
</head>
<body>
<div>Lorem ipsum dolor sit amet, consectetur adipisicing elit.</div>
</body>
</html>
