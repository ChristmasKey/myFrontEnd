<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>绝对定位</title>
    <style>
        /*
        包含块：
            1.没有脱离文档流的元素，其父元素就是它的包含块
            2.脱离文档流的元素，第一个开启定位的祖先元素，就是它的包含块
        */

        .outer {
            width: 500px;
            background-color: skyblue;
            border: 1px solid black;
            padding: 20px;
            /*父元素开启定位*/
            position: relative;
        }

        .box {
            width: 200px;
            height: 200px;
            font-size: 20px;
        }

        .box1 {
            background-color: orange;
        }

        .box2 {
            background-color: yellow;
            /*子元素开启绝对定位*/
            position: absolute;
            top: 220px;
            left: 20px;
            /*上面只写了top和left，所以只有margin-left和margin-top生效，margin-right和margin-bottom不生效*/
            /*margin-top: 50px;*/
            /*margin-right: 50px;*/
            /*float: right;*/
            transition: 1s all linear;
        }

        .box3 {
            background-color: green;
        }

        /*绝对定位的应用场景：卡片滑动*/
        .outer:hover .box2 {
            left: 220px;
        }
    </style>
</head>
<body>
<div class="outer">
    <div class="box box1">1</div>
    <span class="box box2">2</span>
    <div class="box box3">3</div>
</div>
</body>
</html>
