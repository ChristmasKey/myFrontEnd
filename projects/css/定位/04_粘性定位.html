<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>粘性定位</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            height: 5000px;
        }

        .header {
            height: 100px;
            line-height: 100px;
            text-align: center;
            font-size: 20px;
            background-color: orange;
        }

        .item {
            background-color: gray;
        }

        .first {
            font-size: 40px;
            background-color: skyblue;
            /*开启粘性定位*/
            position: sticky;
            /*粘性定位的偏移量*/
            top: 0;
        }

        /*如果将父元素设置为可滚动的，则粘性定位的参考点会变更为父元素*/
        /*.content {*/
        /*    height: 200px;*/
        /*    overflow: auto;*/
        /*}*/
    </style>
</head>
<body>
<!--头部区域-->
<div class="header">头部</div>
<!--内容区域-->
<div class="content">
    <div class="item">
        <div class="first">A</div>
        <h2>A1</h2>
        <h2>A2</h2>
        <h2>A3</h2>
        <h2>A4</h2>
        <h2>A5</h2>
        <h2>A6</h2>
        <h2>A7</h2>
        <h2>A8</h2>
    </div>
    <div class="item">
        <div class="first">B</div>
        <h2>B1</h2>
        <h2>B2</h2>
        <h2>B3</h2>
        <h2>B4</h2>
        <h2>B5</h2>
        <h2>B6</h2>
        <h2>B7</h2>
        <h2>B8</h2>
    </div>
    <div class="item">
        <div class="first">C</div>
        <h2>C1</h2>
        <h2>C2</h2>
        <h2>C3</h2>
        <h2>C4</h2>
        <h2>C5</h2>
        <h2>C6</h2>
        <h2>C7</h2>
        <h2>C8</h2>
    </div>
    <div class="item">
        <div class="first">D</div>
        <h2>D1</h2>
        <h2>D2</h2>
        <h2>D3</h2>
        <h2>D4</h2>
        <h2>D5</h2>
        <h2>D6</h2>
        <h2>D7</h2>
        <h2>D8</h2>
    </div>
    <div class="item">
        <div class="first">E</div>
        <h2>E1</h2>
        <h2>E2</h2>
        <h2>E3</h2>
        <h2>E4</h2>
        <h2>E5</h2>
        <h2>E6</h2>
        <h2>E7</h2>
        <h2>E8</h2>
    </div>
</div>
</body>
</html>
