<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>定位的特殊应用2</title>
    <style>
        .outer {
            width: 800px;
            height: 400px;
            background-color: #888;
            position: relative;
        }

        .inner {
            width: 400px;
            height: 100px;
            background-color: orange;
            font-size: 20px;
            position: absolute;
            /*在包含块内水平垂直居中*/
            /*方案一（推荐）*/
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
            margin: auto;
            /*方案二（不推荐）*/
            /*left: 50%;*/
            /*top: 50%;*/
            /*水平居中*/
            /*margin-left: -200px;*/
            /*垂直居中*/
            /*margin-top: -50px;*/
        }
    </style>
</head>
<body>
<div class="outer">
    <div class="inner">Hello!</div>
</div>
</body>
</html>
