<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>固定定位</title>
    <style>
        .outer {
            width: 500px;
            background-color: skyblue;
            padding: 20px;
            border: 1px solid black;
        }

        .box {
            width: 200px;
            height: 200px;
            font-size: 20px;
        }

        .box1 {
            background-color: orange;
        }

        .box2 {
            background-color: yellow;
            position: fixed;
            top: 0;
            left: 0;
        }

        .box3 {
            background-color: green;
        }
    </style>
</head>
<body>
<div class="outer">
    <div class="box box1">1</div>
    <div class="box box2">2</div>
    <div class="box box3">3</div>
</div>
</body>
</html>
