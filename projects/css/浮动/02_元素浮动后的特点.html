<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>元素浮动后的特点</title>
    <style>
        .outer {
            width: 800px;
            height: 400px;
            background-color: gray;
            padding: 10px;
            text-align: center;
        }

        .box {
            font-size: 20px;
            padding: 10px;
        }

        .box1 {
            background-color: skyblue;
        }

        .box2 {
            background-color: orange;
            float: left;
            /*特点1：脱离文档流，浮动元素不再按照标准文档流的布局排版*/
            /*特点2：不管是块级元素还是行内元素，浮动后默认宽高都是由内容撑开（尽可能小），可以自定义设置*/
            /*特点3：浮动元素不会独占一行，可以与其他元素共用一行*/
            /*特点4：不会margin合并，也不会margin塌陷，能够完美设置四个方向的margin和padding*/
            /*特点5：不会像行内块一样被当做文本处理（没有行内块的空白问题）*/
            /*width: 200px;*/
            /*height: 200px;*/
            /*margin-left: 20px;*/
            /*margin-right: 30px;*/
            /*margin-top: 20px;*/
            /*margin-bottom: 100px;*/
        }

        .box3 {
            background-color: green;
            float: left;
        }

    </style>
</head>
<body>
<div class="outer">
    <div class="box box1">盒子1</div>
    <div class="box box2">盒子2</div>
    <div class="box box3">盒子3</div>
</div>
</body>
</html>
